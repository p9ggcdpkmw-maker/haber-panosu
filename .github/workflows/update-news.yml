name: Haberleri güncelle

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Groq anahtarını test et (geçici teşhis adımı)
        run: |
          curl -s -o /tmp/resp.json -w "HTTP durum kodu: %{http_code}\n" https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"llama-3.3-70b-versatile","messages":[{"role":"user","content":"merhaba"}],"max_tokens":10}'
          echo "Groq'un tam yanıtı:"
          cat /tmp/resp.json
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - run: pip install requests

      - run: python fetch_and_summarize.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: news.json değiştiyse commit et
        run: |
          git config user.name "haber-botu"
          git config user.email "[email protected]"
          git add news.json
          if ! git diff --quiet --cached; then
            git commit -m "Haberleri güncelle"
          fi
          git fetch origin main
          git merge -X ours --no-edit origin/main
          git push


