<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keşif Panosu">
<meta name="theme-color" content="#1B1713">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237FA66B'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle'%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237FA66B'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle'%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
<title>Keşif Panosu</title>
<style>
  :root{
    --bg:#1B1713;
    --ink:#F2E9DC;
    --ink-dim:#A99C89;
    --rule:#3A3025;
    --paper:#2C251D;
    --font-display: Georgia, 'Source Serif Pro', 'Iowan Old Style', serif;
    --font-sans: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);}
  body{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    background-image: radial-gradient(circle at 20% 0%, #2a2219 0%, transparent 45%), radial-gradient(circle at 85% 15%, #221c16 0%, transparent 40%);
  }
  header{padding:20px 18px 6px;max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  h1{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:0.2px;margin:0;}
  .clockBox{text-align:right;flex:none;}
  .clockTime{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);}
  .clockDate{font-size:11px;color:var(--ink-dim);margin-top:1px;}
  .weatherLine{font-size:11px;color:var(--ink-dim);margin-top:2px;}

  .tickerBar{max-width:760px;margin:10px auto 0;overflow:hidden;white-space:nowrap;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--paper);padding:7px 0;}
  .tickerTrack{display:inline-flex;animation:ticker-scroll 18s linear infinite;}
  .tickerTrack span{padding:0 22px;font-size:12.5px;color:var(--ink-dim);font-family:var(--font-sans);white-space:nowrap;}
  .tickerTrack strong{color:var(--ink);font-weight:700;}
  .tickerTrack .up{color:#7FA66B;}
  .tickerTrack .down{color:#C25B6B;}
  @keyframes ticker-scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }

  .controls{max-width:760px;margin:14px auto 0;padding:0 18px;position:relative;display:flex;gap:7px;align-items:center;}
  .menuBtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 10px;border-radius:12px;font-size:13px;cursor:pointer;font-family:var(--font-sans);flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;justify-content:center;}
  .iconBtn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 11px;border-radius:12px;font-size:15px;cursor:pointer;font-family:var(--font-sans);flex:none;}
  .menuBtn .dotCur{width:9px;height:9px;border-radius:50%;background:var(--curColor,#D8A34E);display:inline-block;}
  .menuPanel{position:absolute;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:6px;min-width:200px;max-height:280px;overflow-y:auto;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  #menuPanel{left:18px;}
  #sourcePanel{left:18px;}
  .menuPanel[hidden]{display:none;}
  .menuItem{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:none;color:var(--ink);padding:9px 10px;border-radius:8px;font-size:14px;text-align:left;cursor:pointer;font-family:var(--font-sans);}
  .menuItem:active{background:rgba(255,255,255,0.06);}
  .menuItem .dot{width:9px;height:9px;border-radius:50%;background:var(--dotColor,#D8A34E);flex:none;}
  .menuItem.sel{font-weight:700;}

  .searchRow{max-width:760px;margin:10px auto 0;padding:0 18px;}
  .searchInput{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:14px;font-family:var(--font-sans);}
  .searchInput::placeholder{color:var(--ink-dim);}

  .shareBtn{position:absolute;top:10px;right:42px;background:transparent;border:none;font-size:16px;line-height:1;cursor:pointer;color:var(--ink-dim);padding:4px;}

  main{max-width:760px;margin:0 auto;padding:16px 16px 60px;}
  .status{color:var(--ink-dim);font-size:12px;margin:10px 4px 16px;min-height:16px;line-height:1.5;}
  .tray{display:flex;flex-direction:column;gap:14px;}
  .item{
    position:relative;
    background:var(--paper);
    border-left:5px solid var(--catColor,#D8A34E);
    border-radius:4px 16px 16px 4px;
    padding:14px 72px 14px 16px;
    box-shadow:0 1px 0 rgba(0,0,0,.25);
  }
  .item:nth-child(3n+1){transform:rotate(-0.4deg);}
  .item:nth-child(3n+2){transform:rotate(0.5deg);}
  .item:nth-child(3n){transform:rotate(-0.15deg);}
  .item.read{opacity:0.45;}
  .itemLink{display:block;text-decoration:none;color:inherit;}
  .itemLink:active .title{color:var(--catColor,#D8A34E);}
  .meta{font-size:11.5px;color:var(--catColor,#D8A34E);margin-bottom:7px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-weight:600;letter-spacing:0.1px;}
  .meta .dot{color:var(--ink-dim);font-weight:400;}
  .title{font-family:var(--font-display);font-size:17px;line-height:1.4;color:var(--ink);}
  .snippet{font-size:13px;color:var(--ink-dim);line-height:1.5;margin-top:6px;}
  .likeBtn{position:absolute;top:10px;right:10px;background:transparent;border:none;font-size:19px;line-height:1;cursor:pointer;color:var(--ink-dim);padding:4px;}
  .likeBtn.liked{color:var(--catColor,#D8A34E);}
  .empty{color:var(--ink-dim);font-size:14px;padding:20px 4px;}
  .showReadBtn{background:transparent;border:1px dashed var(--rule);color:var(--ink-dim);font-size:12.5px;padding:7px 12px;border-radius:10px;cursor:pointer;font-family:var(--font-sans);margin-top:4px;}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F3ECDF; --paper:#FFFBF3; --ink:#241C12; --ink-dim:#8A7C66; --rule:#D8CBB2;
    }
  }
  :root[data-theme="light"]{
    --bg:#F3ECDF; --paper:#FFFBF3; --ink:#241C12; --ink-dim:#8A7C66; --rule:#D8CBB2;
  }
</style>
</head>
<body>
<header>
  <h1>Keşif Panosu</h1>
  <div class="clockBox">
    <div class="clockTime" id="clockTime">--:--:--</div>
    <div class="clockDate" id="clockDate">—</div>
    <div class="weatherLine" id="weatherLine">—</div>
  </div>
</header>

<div class="tickerBar">
  <div class="tickerTrack" id="tickerTrack">
    <span>Yükleniyor…</span>
  </div>
</div>

<div class="controls">
  <button class="menuBtn" id="menuBtn"><span class="dotCur" id="menuDot"></span> <span id="menuLabel">Tümü</span> ▾</button>
  <div class="menuPanel" id="menuPanel" hidden></div>

  <button class="menuBtn" id="sourceBtn"><span id="sourceLabel">Kaynak</span> ▾</button>
  <div class="menuPanel" id="sourcePanel" hidden></div>

  <button class="iconBtn" id="refreshBtn" aria-label="Yenile">↻</button>
  <button class="iconBtn" id="themeBtn" aria-label="Tema değiştir">🌙</button>
</div>

<div class="searchRow">
  <input type="search" class="searchInput" id="searchInput" placeholder="Başlıklarda ara…">
</div>

<main>
  <div class="status" id="status">Yükleniyor…</div>
  <div id="list" class="tray"></div>
</main>

<script>
const CAT_COLORS = {
  teknoloji: '#5B8DEF',
  bilim:     '#E0A62B',
  sanat:     '#C25B6B',
  oyun:      '#4FA37A',
  doga:      '#8FA34E',
  dunya:     '#8D7BB5',
  gundem:    '#B9AD98',
};

const CAT_LABELS = {
  teknoloji: 'Teknoloji', bilim: 'Bilim', sanat: 'Sanat',
  oyun: 'Ücretsiz Oyun', doga: 'Doğa', dunya: 'Dünya', gundem: 'Gündem',
};

const AUTO_REFRESH_MS = 6 * 60 * 1000; // 6 dakikada bir news.json'u yeniden okur (veri 30 dk'da bir botla tazeleniyor)
let lastErrorMsg = '';

function timeAgo(dateStr){
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diffMin = Math.round((Date.now() - d.getTime()) / 60000);
  if (diffMin < 60) return diffMin + ' dk önce';
  const diffH = Math.round(diffMin / 60);
  if (diffH < 24) return diffH + ' sa önce';
  return Math.round(diffH / 24) + ' gün önce';
}

function ageDays(dateStr){
  const d = new Date(dateStr);
  if (isNaN(d)) return 999;
  return (Date.now() - d.getTime()) / 86400000;
}

async function fetchNewsJson(){
  const res = await fetch('news.json?t=' + Date.now()); // önbelleği atlamak için
  if (!res.ok) throw new Error('status ' + res.status);
  const data = await res.json();
  const items = (data.items || []).map(it => ({
    cat: CAT_LABELS[it.catId] || it.cat || it.catId,
    catId: it.catId,
    title: it.title,
    source: it.source,
    link: it.link,
    pubDate: it.pubDate,
    snippet: it.summary || '',
  }));
  return { items, updated: data.updated, weather: data.weather, market: data.market, stocks: data.stocks };
}

function getStoredTheme(){
  return localStorage.getItem('kp_theme');
}
function effectiveTheme(){
  return getStoredTheme() || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
}
function applyTheme(){
  const stored = getStoredTheme();
  if (stored) document.documentElement.setAttribute('data-theme', stored);
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('themeBtn').textContent = effectiveTheme() === 'dark' ? '☀️' : '🌙';
}
function toggleTheme(){
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  localStorage.setItem('kp_theme', next);
  applyTheme();
}

function startClock(){
  function tick(){
    const now = new Date();
    document.getElementById('clockTime').textContent = now.toLocaleTimeString('tr-TR');
    document.getElementById('clockDate').textContent = now.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'long' });
  }
  tick();
  setInterval(tick, 1000);
}

function renderWeather(weather){
  const el = document.getElementById('weatherLine');
  if (!weather || weather.temp == null){
    el.textContent = 'Hava durumu alınamadı';
    return;
  }
  el.textContent = Math.round(weather.temp) + '°C · ' + (weather.desc || '');
}

function renderTicker(market, stocks){
  const track = document.getElementById('tickerTrack');
  const hasBasics = market && (market.usdtry != null || market.eurtry != null || market.gold_gram_try != null);
  const hasStocks = Array.isArray(stocks) && stocks.length > 0;
  if (!hasBasics && !hasStocks){
    track.innerHTML = '<span>Piyasa verisi şu an alınamadı</span>';
    return;
  }
  const parts = [];
  if (market.usdtry != null) parts.push('USD/TRY <strong>' + market.usdtry.toFixed(2) + '</strong>');
  if (market.eurtry != null) parts.push('EUR/TRY <strong>' + market.eurtry.toFixed(2) + '</strong>');
  if (market.gold_gram_try != null) parts.push('Gram Altın <strong>₺' + market.gold_gram_try.toLocaleString('tr-TR') + '</strong>');
  if (hasStocks){
    stocks.forEach(s => {
      if (!s || s.price == null) return;
      const pct = s.change_pct;
      const arrow = pct == null ? '' : (pct >= 0
        ? ' <span class="up">▲' + pct.toFixed(2) + '%</span>'
        : ' <span class="down">▼' + Math.abs(pct).toFixed(2) + '%</span>');
      parts.push(s.label + ' <strong>' + s.price.toLocaleString('tr-TR') + '</strong>' + arrow);
    });
  }
  // İçerik kesintisiz dönsün diye iki kez tekrarlanıyor; hız öğe sayısına göre ayarlanıyor
  track.style.animationDuration = Math.max(16, parts.length * 3.5) + 's';
  const html = parts.map(p => '<span>' + p + '</span>').join('');
  track.innerHTML = html + html;
}

// ---- Kalıcı durum: okunanlar, beğeniler ----
function loadJSON(key, fallback){
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch(e){ return fallback; }
}
function saveJSON(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}
let readLinks = new Set(loadJSON('kp_read', []));
let likedLinks = new Set(loadJSON('kp_liked', []));
let catLikes = loadJSON('kp_catlikes', {});

function markRead(link){
  if (readLinks.has(link)) return;
  readLinks.add(link);
  saveJSON('kp_read', Array.from(readLinks));
}

function toggleLike(item, btn){
  const already = likedLinks.has(item.link);
  if (already){
    likedLinks.delete(item.link);
    catLikes[item.catId] = Math.max(0, (catLikes[item.catId]||0) - 1);
    btn.classList.remove('liked');
    btn.textContent = '♡';
  } else {
    likedLinks.add(item.link);
    catLikes[item.catId] = (catLikes[item.catId]||0) + 1;
    btn.classList.add('liked');
    btn.textContent = '♥';
  }
  saveJSON('kp_liked', Array.from(likedLinks));
  saveJSON('kp_catlikes', catLikes);
}

function score(item){
  let age = ageDays(item.pubDate);
  if (isNaN(age)) age = 10;
  const catBoost = (catLikes[item.catId] || 0) * 0.4;
  const linkBoost = likedLinks.has(item.link) ? 3 : 0;
  const generalPenalty = item.catId === 'gundem' ? 0.6 : 0;
  return age - catBoost - linkBoost + generalPenalty;
}

let all = [];
let active = 'all';
let activeSource = 'all';
let searchQuery = '';
let showRead = false;
let lastLoadTime = 0;

function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  let filtered = active === 'all' ? all.slice() : all.filter(i => i.catId === active);
  if (activeSource !== 'all'){
    filtered = filtered.filter(i => i.source === activeSource);
  }
  if (searchQuery){
    const q = searchQuery.toLocaleLowerCase('tr');
    filtered = filtered.filter(i => (i.title || '').toLocaleLowerCase('tr').includes(q));
  }
  filtered.sort((a,b) => score(a) - score(b));

  const hiddenReadCount = filtered.filter(i => readLinks.has(i.link)).length;
  if (!showRead){
    filtered = filtered.filter(i => !readLinks.has(i.link));
  }

  if (filtered.length === 0){
    list.innerHTML = '<div class="empty">Burada şu an gösterilecek başlık yok. "Yenile"yi dene.</div>';
  } else {
    filtered.forEach(item => {
      const isRead = readLinks.has(item.link);
      const card = document.createElement('div');
      card.className = 'item' + (isRead ? ' read' : '');
      card.style.setProperty('--catColor', CAT_COLORS[item.catId] || '#D8A34E');

      const a = document.createElement('a');
      a.className = 'itemLink';
      a.href = item.link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML =
        '<div class="meta"><span>' + item.cat + '</span>' +
        (item.source ? '<span class="dot">·</span>' + item.source : '') +
        (item.pubDate ? '<span class="dot">·</span>' + timeAgo(item.pubDate) : '') +
        (isRead ? '<span class="dot">·</span>okundu' : '') + '</div>' +
        '<div class="title">' + item.title + '</div>' +
        (item.snippet ? '<div class="snippet">' + item.snippet + '</div>' : '');
      a.addEventListener('click', () => { markRead(item.link); card.classList.add('read'); });

      const likeBtn = document.createElement('button');
      likeBtn.className = 'likeBtn' + (likedLinks.has(item.link) ? ' liked' : '');
      likeBtn.textContent = likedLinks.has(item.link) ? '♥' : '♡';
      likeBtn.setAttribute('aria-label', 'Beğen');
      likeBtn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        toggleLike(item, likeBtn);
      });

      const shareBtn = document.createElement('button');
      shareBtn.className = 'shareBtn';
      shareBtn.textContent = '↗';
      shareBtn.setAttribute('aria-label', 'Paylaş');
      shareBtn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        if (navigator.share){
          navigator.share({ title: item.title, url: item.link }).catch(() => {});
        } else {
          window.open('https://wa.me/?text=' + encodeURIComponent(item.title + ' — ' + item.link), '_blank');
        }
      });

      card.appendChild(a);
      card.appendChild(shareBtn);
      card.appendChild(likeBtn);
      list.appendChild(card);
    });
  }

  const showReadBtn = document.getElementById('showReadBtn');
  if (hiddenReadCount > 0 || showRead){
    if (!showReadBtn){
      const b = document.createElement('button');
      b.id = 'showReadBtn';
      b.className = 'showReadBtn';
      document.getElementById('status').insertAdjacentElement('afterend', b);
      b.addEventListener('click', () => { showRead = !showRead; render(); });
    }
    const btn = document.getElementById('showReadBtn');
    btn.textContent = showRead ? 'Okunanları gizle' : 'Okunan ' + hiddenReadCount + ' haberi göster';
  } else if (showReadBtn){
    showReadBtn.remove();
  }
}

function renderMenu(){
  const panel = document.getElementById('menuPanel');
  panel.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'menuItem sel';
  allBtn.innerHTML = '<span class="dot" style="--dotColor:#D8A34E"></span> Tümü';
  allBtn.onclick = () => selectCategory('all', 'Tümü', '#D8A34E');
  panel.appendChild(allBtn);

  Object.keys(CAT_LABELS).forEach(catId => {
    const label = CAT_LABELS[catId];
    const b = document.createElement('button');
    b.className = 'menuItem';
    b.innerHTML = '<span class="dot" style="--dotColor:' + CAT_COLORS[catId] + '"></span> ' + label;
    b.onclick = () => selectCategory(catId, label, CAT_COLORS[catId]);
    panel.appendChild(b);
  });
}

function selectCategory(id, label, color){
  active = id;
  document.getElementById('menuLabel').textContent = label;
  document.getElementById('menuDot').style.setProperty('--curColor', color);
  document.getElementById('menuPanel').hidden = true;
  document.querySelectorAll('.menuItem').forEach(el => el.classList.remove('sel'));
  render();
}

function renderSourceMenu(){
  const panel = document.getElementById('sourcePanel');
  panel.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'menuItem sel';
  allBtn.textContent = 'Tüm kaynaklar';
  allBtn.onclick = () => selectSource('all');
  panel.appendChild(allBtn);

  const sources = Array.from(new Set(all.map(i => i.source).filter(Boolean))).sort((a,b) => a.localeCompare(b, 'tr'));
  sources.forEach(src => {
    const b = document.createElement('button');
    b.className = 'menuItem';
    b.textContent = src;
    b.onclick = () => selectSource(src);
    panel.appendChild(b);
  });
}

function selectSource(src){
  activeSource = src;
  document.getElementById('sourceLabel').textContent = src === 'all' ? 'Kaynak' : src;
  document.getElementById('sourcePanel').hidden = true;
  render();
}

document.getElementById('sourceBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const panel = document.getElementById('sourcePanel');
  panel.hidden = !panel.hidden;
});
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  render();
});
document.getElementById('themeBtn').addEventListener('click', toggleTheme);

document.getElementById('menuBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const panel = document.getElementById('menuPanel');
  panel.hidden = !panel.hidden;
});
document.addEventListener('click', (e) => {
  const panel = document.getElementById('menuPanel');
  const btn = document.getElementById('menuBtn');
  if (!panel.hidden && !panel.contains(e.target) && e.target !== btn){
    panel.hidden = true;
  }
  const sPanel = document.getElementById('sourcePanel');
  const sBtn = document.getElementById('sourceBtn');
  if (!sPanel.hidden && !sPanel.contains(e.target) && e.target !== sBtn){
    sPanel.hidden = true;
  }
});
document.getElementById('refreshBtn').addEventListener('click', loadAll);

async function loadAll(){
  const status = document.getElementById('status');
  status.textContent = 'Yükleniyor…';
  try {
    const { items, updated, weather, market, stocks } = await fetchNewsJson();
    all = items;
    lastLoadTime = Date.now();
    renderWeather(weather);
    renderTicker(market, stocks);
    renderSourceMenu();
    const botTime = updated ? new Date(updated).toLocaleTimeString('tr-TR') : '';
    status.textContent = all.length
      ? 'Haberler botu son güncelleme: ' + botTime + ' · sayfa kontrolü: ' + new Date().toLocaleTimeString('tr-TR')
      : 'Haberler alınamadı. Hata: ' + (lastErrorMsg || 'bilinmiyor') + ' — "Yenile"yi dene.';
    render();
  } catch(e){
    lastErrorMsg = (e && e.message) ? e.message : String(e);
    status.textContent = 'news.json okunamadı (' + lastErrorMsg + '). Bot henüz ilk haberleri yazmamış olabilir, biraz sonra "Yenile"yi dene.';
  }
}

setInterval(loadAll, AUTO_REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastLoadTime > 4 * 60 * 1000){
    loadAll();
  }
});

renderMenu();
applyTheme();
startClock();
loadAll();
</script>
</body>
</html>
