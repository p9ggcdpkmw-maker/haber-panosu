<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RADAR">
<meta name="theme-color" content="#09090b">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%239b51e0'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white'%3E📡%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%239b51e0'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white'%3E📡%3C/text%3E%3C/svg%3E">
<title>RADAR</title>
<style>
  :root {
    --bg-main: #09090b;
    --bg-panel: #141418;
    --bg-card: #1c1c24;
    --text-main: #f4f4f5;
    --text-muted: #a1a1aa;
    --border: #27272a;
    --accent: #9b51e0;
    --accent-cyan: #06b6d4;
    --green: #10b981;
    --red: #ef4444;
    --radius-lg: 20px;
    --radius-md: 12px;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: var(--font-sans);
    min-height: 100vh;
    background-image: radial-gradient(circle at 50% -20%, #2a1b3d 0%, transparent 50%);
    -webkit-font-smoothing: antialiased;
  }

  /* Layout */
  .app-container {
    display: grid;
    grid-template-columns: 240px 1fr 300px;
    gap: 24px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
    height: 100vh;
    overflow: hidden;
  }

  /* Sol Menü (Sidebar) */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  .logo {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .logo span { color: var(--accent); }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
    font-size: 14px;
    border: 1px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
  .nav-item.active { background: rgba(155, 81, 224, 0.15); color: var(--accent); border-color: rgba(155, 81, 224, 0.3); }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .nav-item.active .nav-dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  /* Orta Alan (Feed) */
  .main-feed {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding-right: 8px;
  }
  .feed-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .feed-title { font-size: 20px; font-weight: 600; }
  .search-box {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    color: var(--text-main);
    outline: none;
    width: 250px;
  }
  .search-box:focus { border-color: var(--accent); }

  /* Haber Kartları (Bento Grid) */
  .feed-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .news-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }
  .news-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .news-card.read { opacity: 0.6; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; color: var(--text-muted); }
  .card-cat { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .cat-dot { width: 6px; height: 6px; border-radius: 50%; }
  .card-title { font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; color: var(--text-main); }
  .card-snippet { font-size: 13px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-image { width: calc(100% + 32px); height: 160px; margin: -16px -16px 16px -16px; object-fit: cover; background: var(--bg-card); }
  
  .card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .action-btn {
    background: rgba(255,255,255,0.05);
    border: none;
    color: var(--text-muted);
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s; font-size: 16px;
  }
  .action-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
  .action-btn.liked { color: var(--accent); background: rgba(155, 81, 224, 0.15); }

  /* Sağ Panel (Widgets) */
  .widgets {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }
  .widget-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
  }
  .widget-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 16px; font-weight: 700; }
  
  .market-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; }
  .market-label { font-weight: 500; }
  .market-val { font-weight: 600; text-align: right; }
  .market-pct { font-size: 11px; margin-top: 2px; }
  .up { color: var(--green); }
  .down { color: var(--red); }

  .weather-temp { font-size: 42px; font-weight: 700; margin-bottom: 4px; }
  .weather-desc { font-size: 14px; color: var(--text-muted); }
  .weather-meta { margin-top: 16px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 12px; }

  /* Haber Detay Modalı */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
    z-index: 1000; padding: 20px;
  }
  .modal-overlay.active { opacity: 1; pointer-events: all; }
  .modal-content {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    width: 100%; max-width: 600px; max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    transform: translateY(20px); transition: transform 0.3s;
    position: relative;
  }
  .modal-overlay.active .modal-content { transform: translateY(0); }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255,255,255,0.1); border: none; color: white;
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
  }
  .modal-header { margin-bottom: 20px; }
  .modal-title { font-size: 24px; font-weight: 700; line-height: 1.3; margin-bottom: 12px; }
  .modal-meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 12px; margin-bottom: 24px; }
  .modal-body { font-size: 15px; line-height: 1.7; color: #d4d4d8; }
  .modal-link { display: inline-block; margin-top: 24px; background: var(--accent); color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; text-align: center; }

  /* Durum Mesajları */
  .status-msg { font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 20px; }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

  /* Mobil Uyumluluk */
  @media (max-width: 1024px) {
    .app-container { grid-template-columns: 200px 1fr; }
    .widgets { display: none; } /* Mobilde sağ panel gizlenir (veya alta alınabilir) */
  }
  @media (max-width: 768px) {
    .app-container { grid-template-columns: 1fr; padding: 16px; height: auto; overflow: visible; }
    .sidebar { flex-direction: row; overflow-x: auto; padding-bottom: 12px; gap: 8px; margin-bottom: 8px; }
    .logo { display: none; }
    .nav-item { white-space: nowrap; padding: 8px 16px; font-size: 13px; }
    .main-feed { overflow: visible; padding-right: 0; }
    .feed-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .search-box { width: 100%; }
    .widgets { display: flex; margin-top: 24px; } /* Mobilde alta alındı */
    .feed-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app-container">
  <!-- SOL MENÜ -->
  <aside class="sidebar">
    <div class="logo"><span>●</span> RADAR</div>
    <div class="nav-item active" data-id="all">
      <div class="nav-dot" style="background:#fff; box-shadow:0 0 10px #fff"></div> Tümü
    </div>
    <!-- Kategoriler JS ile buraya eklenecek -->
  </aside>

  <!-- ORTA ALAN (HABERLER) -->
  <main class="main-feed">
    <div class="feed-header">
      <div class="feed-title" id="feedTitle">Gündem Akışı</div>
      <input type="search" class="search-box" id="searchInput" placeholder="Haberlerde ara...">
    </div>
    <div class="feed-grid" id="newsGrid">
      <!-- Haber kartları JS ile buraya gelecek -->
      <div class="status-msg">Radar başlatılıyor, veriler çekiliyor... 📡</div>
    </div>
    <div class="status-msg" id="statusText"></div>
  </main>

  <!-- SAĞ PANEL (WIDGET'LAR) -->
  <aside class="widgets">
    <div class="widget-card">
      <div class="widget-title">Ekonomi Piyasaları</div>
      <div id="marketContainer">
        <div class="status-msg">Yükleniyor...</div>
      </div>
    </div>

    <div class="widget-card">
      <div class="widget-title">Çorlu Hava Durumu</div>
      <div id="weatherContainer">
        <div class="status-msg">Yükleniyor...</div>
      </div>
    </div>
  </aside>
</div>

<!-- HABER DETAY MODALI -->
<div class="modal-overlay" id="newsModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-meta" id="modalMeta"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <a href="#" class="modal-link" id="modalLink" target="_blank">Haberi Kaynağında Oku ↗</a>
  </div>
</div>

<script>
// --- YAPILANDIRMA ---
const CATEGORIES = {
  teknoloji: { label: 'Teknoloji', color: '#06b6d4' },
  bilim:     { label: 'Bilim', color: '#10b981' },
  sanat:     { label: 'Sanat', color: '#f59e0b' },
  oyun:      { label: 'Ücretsiz Oyun', color: '#ef4444' },
  doga:      { label: 'Doğa', color: '#84cc16' },
  dunya:     { label: 'Dünya', color: '#8b5cf6' },
  gundem:    { label: 'Gündem', color: '#a1a1aa' },
  corlu:     { label: 'Çorlu', color: '#ec4899' } // YENİ
};

let allNews = [];
let activeCat = 'all';
let searchQ = '';
let readLinks = new Set(JSON.parse(localStorage.getItem('radar_read') || '[]'));
let likedLinks = new Set(JSON.parse(localStorage.getItem('radar_liked') || '[]'));

// --- GÜVENLİK (XSS KORUMASI) ---
function esc(str) {
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}

function timeAgo(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diff = (Date.now() - d.getTime()) / 60000;
  if (diff < 60) return Math.round(diff) + ' dk önce';
  if (diff < 1440) return Math.round(diff / 60) + ' sa önce';
  return Math.round(diff / 1440) + ' gün önce';
}

// --- MENÜ OLUŞTURMA ---
function initSidebar() {
  const sidebar = document.querySelector('.sidebar');
  Object.keys(CATEGORIES).forEach(id => {
    const cat = CATEGORIES[id];
    const el = document.createElement('div');
    el.className = 'nav-item';
    el.dataset.id = id;
    el.innerHTML = `<div class="nav-dot" style="background:${cat.color}; box-shadow:0 0 10px ${cat.color}"></div> ${cat.label}`;
    el.onclick = () => selectCategory(id, el);
    sidebar.appendChild(el);
  });
  
  // Tümü butonu için tıklama
  document.querySelector('.nav-item[data-id="all"]').onclick = function() {
    selectCategory('all', this);
  };
}

function selectCategory(id, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  activeCat = id;
  
  const title = id === 'all' ? 'Gündem Akışı' : CATEGORIES[id].label;
  document.getElementById('feedTitle').textContent = title + ' Akışı';
  renderNews();
}

// --- HABERLERİ RENDER ETME ---
function renderNews() {
  const grid = document.getElementById('newsGrid');
  grid.innerHTML = '';

  let filtered = activeCat === 'all' ? allNews : allNews.filter(n => n.catId === activeCat);
  
  if (searchQ) {
    const q = searchQ.toLocaleLowerCase('tr');
    filtered = filtered.filter(n => n.title.toLocaleLowerCase('tr').includes(q));
  }

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="status-msg">Bu kategoride henüz haber yok.</div>';
    return;
  }

  filtered.forEach(item => {
    const cat = CATEGORIES[item.catId] || { label: 'Haber', color: '#fff' };
    const isRead = readLinks.has(item.link);
    const isLiked = likedLinks.has(item.link);

    const card = document.createElement('div');
    card.className = 'news-card' + (isRead ? ' read' : '');
    
    // Görsel varsa ekle
    let imgHtml = '';
    if (item.image) {
      imgHtml = `<img src="${esc(item.image)}" class="card-image" onerror="this.style.display='none'">`;
    }

    card.innerHTML = `
      ${imgHtml}
      <div class="card-header">
        <div class="card-cat" style="color:${cat.color}">
          <div class="cat-dot" style="background:${cat.color}"></div> ${esc(cat.label)}
        </div>
        <div>${timeAgo(item.pubDate)}</div>
      </div>
      <div class="card-title">${esc(item.title)}</div>
      <div class="card-snippet">${esc(item.summary) || 'Özet hazırlanıyor...'}</div>
      <div class="card-actions">
        <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" onclick="event.stopPropagation(); toggleLike('${esc(item.link)}', this)">
          ${isLiked ? '♥' : '♡'}
        </button>
      </div>
    `;

    // Karta tıklayınca modal aç
    card.onclick = () => openModal(item, cat);
    grid.appendChild(card);
  });
}

// --- MODAL MANTIĞI ---
function openModal(item, cat) {
  // Okundu olarak işaretle
  readLinks.add(item.link);
  localStorage.setItem('radar_read', JSON.stringify(Array.from(readLinks)));
  
  document.getElementById('modalTitle').textContent = item.title;
  document.getElementById('modalMeta').innerHTML = `
    <span style="color:${cat.color}; font-weight:600">${esc(cat.label)}</span>
    <span>•</span>
    <span>${esc(item.source)}</span>
    <span>•</span>
    <span>${timeAgo(item.pubDate)}</span>
  `;
  
  // Uzun özet (yoksa snippet)
  document.getElementById('modalBody').textContent = item.summary || item.snippet || 'Bu haber için henüz detaylı bir özet hazırlanmadı.';
  
  const linkBtn = document.getElementById('modalLink');
  linkBtn.href = item.link;
  
  document.getElementById('newsModal').classList.add('active');
  
  // Arka planda kartı soluklaştır
  renderNews(); 
}

function closeModal() {
  document.getElementById('newsModal').classList.remove('active');
}

document.getElementById('newsModal').addEventListener('click', (e) => {
  if (e.target.id === 'newsModal') closeModal();
});

// --- BEĞENİ MANTIĞI ---
function toggleLike(link, btn) {
  if (likedLinks.has(link)) {
    likedLinks.delete(link);
    btn.classList.remove('liked');
    btn.textContent = '♡';
  } else {
    likedLinks.add(link);
    btn.classList.add('liked');
    btn.textContent = '♥';
  }
  localStorage.setItem('radar_liked', JSON.stringify(Array.from(likedLinks)));
}

// --- VERİ ÇEKME VE WIDGET'LAR ---
async function loadData() {
  try {
    const res = await fetch('news.json?t=' + Date.now());
    if (!res.ok) throw new Error('Veri alınamadı');
    const data = await res.json();
    
    allNews = data.items || [];
    renderNews();
    
    // Widget'ları doldur
    renderMarket(data.market, data.stocks);
    renderWeather(data.weather);
    
    const updateTime = data.updated ? new Date(data.updated).toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'}) : '';
    document.getElementById('statusText').textContent = `Son Radar Güncellemesi: ${updateTime}`;
    
  } catch (e) {
    document.getElementById('newsGrid').innerHTML = `<div class="status-msg">Bağlantı hatası: ${e.message}</div>`;
  }
}

function renderMarket(market, stocks) {
  const container = document.getElementById('marketContainer');
  if (!market && (!stocks || stocks.length === 0)) {
    container.innerHTML = '<div class="status-msg">Piyasa verisi yok.</div>';
    return;
  }
  
  let html = '';
  if (market) {
    if (market.usdtry) html += `<div class="market-item"><div class="market-label">USD/TRY</div><div class="market-val">${market.usdtry.toFixed(2)}</div></div>`;
    if (market.eurtry) html += `<div class="market-item"><div class="market-label">EUR/TRY</div><div class="market-val">${market.eurtry.toFixed(2)}</div></div>`;
    if (market.gold_gram_try) html += `<div class="market-item"><div class="market-label">Gram Altın</div><div class="market-val">₺${market.gold_gram_try.toLocaleString('tr-TR')}</div></div>`;
  }

  if (stocks && stocks.length > 0) {
    stocks.slice(0, 4).forEach(s => {
      if (s.price == null) return;
      const pct = s.change_pct;
      const colorClass = pct > 0 ? 'up' : (pct < 0 ? 'down' : '');
      const sign = pct > 0 ? '+' : '';
      const pctHtml = pct != null ? `<div class="market-pct ${colorClass}">${sign}${pct.toFixed(2)}%</div>` : '';
      
      html += `
        <div class="market-item">
          <div class="market-label">${esc(s.label)}</div>
          <div>
            <div class="market-val">${s.price.toLocaleString('tr-TR')}</div>
            ${pctHtml}
          </div>
        </div>
      `;
    });
  }
  container.innerHTML = html;
}

function renderWeather(weather) {
  const container = document.getElementById('weatherContainer');
  if (!weather || weather.temp == null) {
    container.innerHTML = '<div class="status-msg">Hava durumu alınamadı.</div>';
    return;
  }
  
  container.innerHTML = `
    <div class="weather-temp">${Math.round(weather.temp)}°C</div>
    <div class="weather-desc">${esc(weather.desc)}</div>
    <div class="weather-meta">Konum: Çorlu, Tekirdağ</div>
  `;
}

// --- BAŞLAT ---
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQ = e.target.value.trim();
  renderNews();
});

initSidebar();
loadData();
// Her 5 dakikada bir yenile
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
