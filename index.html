<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keşif Panosu</title>
<style>
  :root{
    --bg:#1B1713;
    --ink:#F2E9DC;
    --ink-dim:#A99C89;
    --rule:#3A3025;
    --paper:#2C251D;
    --font-display: Georgia, 'Source Serif Pro', 'Iowan Old Style', serif;
    --font-sans: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);}
  body{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    background-image: radial-gradient(circle at 20% 0%, #2a2219 0%, transparent 45%), radial-gradient(circle at 85% 15%, #221c16 0%, transparent 40%);
  }
  header{padding:30px 18px 6px;max-width:760px;margin:0 auto;}
  h1{font-family:var(--font-display);font-weight:400;font-size:27px;letter-spacing:0.2px;margin:0 0 8px;}
  .sub{color:var(--ink-dim);font-size:13.5px;line-height:1.55;margin:0;max-width:520px;}

  .controls{max-width:760px;margin:18px auto 0;padding:0 18px;position:relative;}
  .menuBtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:12px;font-size:14px;cursor:pointer;font-family:var(--font-sans);}
  .menuBtn .dotCur{width:9px;height:9px;border-radius:50%;background:var(--curColor,#D8A34E);display:inline-block;}
  .menuPanel{position:absolute;top:calc(100% + 6px);left:18px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:6px;min-width:200px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .menuPanel[hidden]{display:none;}
  .menuItem{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:none;color:var(--ink);padding:9px 10px;border-radius:8px;font-size:14px;text-align:left;cursor:pointer;font-family:var(--font-sans);}
  .menuItem:active{background:rgba(255,255,255,0.06);}
  .menuItem .dot{width:9px;height:9px;border-radius:50%;background:var(--dotColor,#D8A34E);flex:none;}
  .menuItem.sel{font-weight:700;}

  main{max-width:760px;margin:0 auto;padding:16px 16px 60px;}
  .status{color:var(--ink-dim);font-size:12px;margin:10px 4px 16px;min-height:16px;line-height:1.5;}
  .tray{display:flex;flex-direction:column;gap:14px;}
  .item{
    position:relative;
    background:var(--paper);
    border-left:5px solid var(--catColor,#D8A34E);
    border-radius:4px 16px 16px 4px;
    padding:14px 46px 14px 16px;
    box-shadow:0 1px 0 rgba(0,0,0,.25);
  }
  .item:nth-child(3n+1){transform:rotate(-0.4deg);}
  .item:nth-child(3n+2){transform:rotate(0.5deg);}
  .item:nth-child(3n){transform:rotate(-0.15deg);}
  .item.read{opacity:0.45;}
  .itemLink{display:block;text-decoration:none;color:inherit;}
  .itemLink:active .title{color:var(--catColor,#D8A34E);}
  .meta{font-size:11.5px;color:var(--catColor,#D8A34E);margin-bottom:7px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-weight:600;letter-spacing:0.1px;}
  .meta .dot{color:var(--ink-dim);font-weight:400;}
  .title{font-family:var(--font-display);font-size:17px;line-height:1.4;color:var(--ink);}
  .likeBtn{position:absolute;top:10px;right:10px;background:transparent;border:none;font-size:19px;line-height:1;cursor:pointer;color:var(--ink-dim);padding:4px;}
  .likeBtn.liked{color:var(--catColor,#D8A34E);}
  .empty{color:var(--ink-dim);font-size:14px;padding:20px 4px;}
  .showReadBtn{background:transparent;border:1px dashed var(--rule);color:var(--ink-dim);font-size:12.5px;padding:7px 12px;border-radius:10px;cursor:pointer;font-family:var(--font-sans);margin-top:4px;}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F3ECDF; --paper:#FFFBF3; --ink:#241C12; --ink-dim:#8A7C66; --rule:#D8CBB2;
    }
  }
</style>
</head>
<body>
<header>
  <h1>Keşif Panosu</h1>
  <p class="sub">Teknoloji, bilim, sanat, ücretsiz oyunlar ve doğa üzerine — yerli ve yabancı kaynaklardan taranmış başlıklar, artı genel gündemden öne çıkanlar. Bir başlığa dokun, doğrudan kaynağına gider. Beğendiğin haberler o tür haberleri öne çıkarır.</p>
</header>

<div class="controls">
  <button class="menuBtn" id="menuBtn"><span class="dotCur" id="menuDot"></span> <span id="menuLabel">Tümü</span> ▾</button>
  <div class="menuPanel" id="menuPanel" hidden></div>
</div>

<main>
  <div class="status" id="status">Yükleniyor…</div>
  <div id="list" class="tray"></div>
</main>

<script>
const CATEGORIES = [
  { id: 'teknoloji', label: 'Teknoloji', query: 'teknoloji' },
  { id: 'bilim',     label: 'Bilim',     query: 'bilim' },
  { id: 'sanat',     label: 'Sanat',     query: 'sanat' },
  { id: 'oyun',      label: 'Ücretsiz Oyun', query: 'ücretsiz oyun dağıtıyor' },
  { id: 'doga',      label: 'Doğa',      query: 'doğa çevre' },
  { id: 'gundem',    label: 'Gündem',    query: null }, // genel öne çıkanlar (Google'ın kendi gündemi)
];

const CAT_COLORS = {
  teknoloji: '#5B8DEF',
  bilim:     '#E0A62B',
  sanat:     '#C25B6B',
  oyun:      '#4FA37A',
  doga:      '#8FA34E',
  gundem:    '#B9AD98',
};

// Birden fazla ülke/dil baskısı taranır, böylece yerli + yabancı kaynaklar birlikte gelir
const EDITIONS = [
  { hl: 'tr',    gl: 'TR', ceid: 'TR:tr'  },
  { hl: 'en-US', gl: 'US', ceid: 'US:en'  },
];

const PROXIES = [
  url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
  url => 'https://corsproxy.io/?url=' + encodeURIComponent(url),
  url => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
];

const PROXY_TIMEOUT_MS = 6000;
const MAX_AGE_DAYS = 5;
const MIN_ITEMS_PER_CAT = 4;
const AUTO_REFRESH_MS = 5 * 60 * 1000; // 5 dakikada bir otomatik yenile

function buildUrl(query, ed){
  if (query){
    return 'https://news.google.com/rss/search?q=' + encodeURIComponent(query) + '&hl=' + ed.hl + '&gl=' + ed.gl + '&ceid=' + ed.ceid;
  }
  return 'https://news.google.com/rss?hl=' + ed.hl + '&gl=' + ed.gl + '&ceid=' + ed.ceid;
}

async function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    return await fetch(url, { signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function fetchWithFallback(targetUrl){
  let lastErr;
  for (const build of PROXIES){
    try {
      const res = await fetchWithTimeout(build(targetUrl), PROXY_TIMEOUT_MS);
      if (!res.ok) throw new Error('status ' + res.status);
      const text = await res.text();
      if (!text || text.length < 50) throw new Error('boş yanıt');
      return text;
    } catch(e){
      lastErr = e;
    }
  }
  throw lastErr || new Error('tüm kaynaklar başarısız');
}

function timeAgo(dateStr){
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diffMin = Math.round((Date.now() - d.getTime()) / 60000);
  if (diffMin < 60) return diffMin + ' dk önce';
  const diffH = Math.round(diffMin / 60);
  if (diffH < 24) return diffH + ' sa önce';
  return Math.round(diffH / 24) + ' gün önce';
}

function ageDays(dateStr){
  const d = new Date(dateStr);
  if (isNaN(d)) return 999;
  return (Date.now() - d.getTime()) / 86400000;
}

function parseItems(xmlText, cat){
  const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
  return Array.from(xml.querySelectorAll('item')).map(it => {
    const rawTitle = it.querySelector('title')?.textContent || '';
    const sourceEl = it.querySelector('source');
    const sourceName = sourceEl ? sourceEl.textContent : (rawTitle.split(' - ').pop() || '');
    const title = rawTitle.replace(' - ' + sourceName, '');
    return {
      cat: cat.label,
      catId: cat.id,
      title,
      source: sourceName,
      link: it.querySelector('link')?.textContent || '#',
      pubDate: it.querySelector('pubDate')?.textContent || ''
    };
  });
}

async function fetchCategory(cat){
  const urls = EDITIONS.map(ed => buildUrl(cat.query, ed));
  const texts = await Promise.all(urls.map(u => fetchWithFallback(u).catch(() => null)));
  let items = [];
  texts.forEach(t => { if (t) items.push(...parseItems(t, cat)); });

  const seen = new Set();
  items = items.filter(i => {
    if (!i.link || seen.has(i.link)) return false;
    seen.add(i.link);
    return true;
  });
  items.sort((a,b) => ageDays(a.pubDate) - ageDays(b.pubDate));

  const fresh = items.filter(i => ageDays(i.pubDate) <= MAX_AGE_DAYS);
  const final = fresh.length >= MIN_ITEMS_PER_CAT ? fresh : items.slice(0, Math.max(MIN_ITEMS_PER_CAT, fresh.length));
  return final.slice(0, 18);
}

// ---- Kalıcı durum: okunanlar, beğeniler ----
function loadJSON(key, fallback){
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch(e){ return fallback; }
}
function saveJSON(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}
let readLinks = new Set(loadJSON('kp_read', []));
let likedLinks = new Set(loadJSON('kp_liked', []));
let catLikes = loadJSON('kp_catlikes', {});

function markRead(link){
  if (readLinks.has(link)) return;
  readLinks.add(link);
  saveJSON('kp_read', Array.from(readLinks));
}

function toggleLike(item, btn){
  const already = likedLinks.has(item.link);
  if (already){
    likedLinks.delete(item.link);
    catLikes[item.catId] = Math.max(0, (catLikes[item.catId]||0) - 1);
    btn.classList.remove('liked');
    btn.textContent = '♡';
  } else {
    likedLinks.add(item.link);
    catLikes[item.catId] = (catLikes[item.catId]||0) + 1;
    btn.classList.add('liked');
    btn.textContent = '♥';
  }
  saveJSON('kp_liked', Array.from(likedLinks));
  saveJSON('kp_catlikes', catLikes);
}

function score(item){
  let age = ageDays(item.pubDate);
  if (isNaN(age)) age = 10;
  const catBoost = (catLikes[item.catId] || 0) * 0.4; // her beğeni, o kategoriyi biraz öne çeker
  const linkBoost = likedLinks.has(item.link) ? 3 : 0;
  const generalPenalty = item.catId === 'gundem' ? 0.6 : 0; // seçtiğin kategoriler önce, gündem onlardan sonra dolgu olarak gelir
  return age - catBoost - linkBoost + generalPenalty; // küçük olan önce gösterilir
}

let all = [];
let active = 'all';
let showRead = false;
let lastLoadTime = 0;

function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  let filtered = active === 'all' ? all.slice() : all.filter(i => i.catId === active);
  filtered.sort((a,b) => score(a) - score(b));

  const hiddenReadCount = filtered.filter(i => readLinks.has(i.link)).length;
  if (!showRead){
    filtered = filtered.filter(i => !readLinks.has(i.link));
  }

  if (filtered.length === 0){
    list.innerHTML = '<div class="empty">Burada şu an gösterilecek başlık yok.</div>';
  } else {
    filtered.forEach(item => {
      const isRead = readLinks.has(item.link);
      const card = document.createElement('div');
      card.className = 'item' + (isRead ? ' read' : '');
      card.style.setProperty('--catColor', CAT_COLORS[item.catId] || '#D8A34E');

      const a = document.createElement('a');
      a.className = 'itemLink';
      a.href = item.link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML =
        '<div class="meta"><span>' + item.cat + '</span>' +
        (item.source ? '<span class="dot">·</span>' + item.source : '') +
        (item.pubDate ? '<span class="dot">·</span>' + timeAgo(item.pubDate) : '') +
        (isRead ? '<span class="dot">·</span>okundu' : '') + '</div>' +
        '<div class="title">' + item.title + '</div>';
      a.addEventListener('click', () => { markRead(item.link); card.classList.add('read'); });

      const likeBtn = document.createElement('button');
      likeBtn.className = 'likeBtn' + (likedLinks.has(item.link) ? ' liked' : '');
      likeBtn.textContent = likedLinks.has(item.link) ? '♥' : '♡';
      likeBtn.setAttribute('aria-label', 'Beğen');
      likeBtn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        toggleLike(item, likeBtn);
      });

      card.appendChild(a);
      card.appendChild(likeBtn);
      list.appendChild(card);
    });
  }

  const showReadBtn = document.getElementById('showReadBtn');
  if (hiddenReadCount > 0 || showRead){
    if (!showReadBtn){
      const b = document.createElement('button');
      b.id = 'showReadBtn';
      b.className = 'showReadBtn';
      document.getElementById('status').insertAdjacentElement('afterend', b);
      b.addEventListener('click', () => { showRead = !showRead; render(); });
    }
    const btn = document.getElementById('showReadBtn');
    btn.textContent = showRead ? 'Okunanları gizle' : 'Okunan ' + hiddenReadCount + ' haberi göster';
  } else if (showReadBtn){
    showReadBtn.remove();
  }
}

function renderMenu(){
  const panel = document.getElementById('menuPanel');
  panel.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'menuItem sel';
  allBtn.innerHTML = '<span class="dot" style="--dotColor:#D8A34E"></span> Tümü';
  allBtn.onclick = () => selectCategory('all', 'Tümü', '#D8A34E');
  panel.appendChild(allBtn);

  CATEGORIES.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'menuItem';
    b.innerHTML = '<span class="dot" style="--dotColor:' + CAT_COLORS[cat.id] + '"></span> ' + cat.label;
    b.onclick = () => selectCategory(cat.id, cat.label, CAT_COLORS[cat.id]);
    panel.appendChild(b);
  });
}

function selectCategory(id, label, color){
  active = id;
  document.getElementById('menuLabel').textContent = label;
  document.getElementById('menuDot').style.setProperty('--curColor', color);
  document.getElementById('menuPanel').hidden = true;
  document.querySelectorAll('.menuItem').forEach(el => el.classList.remove('sel'));
  render();
}

document.getElementById('menuBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const panel = document.getElementById('menuPanel');
  panel.hidden = !panel.hidden;
});
document.addEventListener('click', (e) => {
  const panel = document.getElementById('menuPanel');
  const btn = document.getElementById('menuBtn');
  if (!panel.hidden && !panel.contains(e.target) && e.target !== btn){
    panel.hidden = true;
  }
});

async function loadAll(){
  const status = document.getElementById('status');
  status.textContent = 'Yükleniyor…';
  try {
    const results = await Promise.all(CATEGORIES.map(cat => fetchCategory(cat).catch(() => [])));
    all = results.flat();
    lastLoadTime = Date.now();
    status.textContent = all.length
      ? 'Son güncelleme: ' + new Date().toLocaleTimeString('tr-TR') + ' · otomatik olarak kendini tazeler'
      : 'Haberler alınamadı, sayfayı yenilemeyi dene.';
    render();
  } catch(e){
    status.textContent = 'Bir şeyler ters gitti, sayfayı yenilemeyi dene.';
  }
}

setInterval(loadAll, AUTO_REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastLoadTime > 3 * 60 * 1000){
    loadAll();
  }
});

renderMenu();
loadAll();
</script>
</body>
</html>
