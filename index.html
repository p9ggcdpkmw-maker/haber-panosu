<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RADAR">
<meta name="theme-color" content="#09090b">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%239b51e0'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white'%3E📡%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%239b51e0'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white'%3E📡%3C/text%3E%3C/svg%3E">
<title>RADAR</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg-main: #050508;
    --bg-panel: rgba(20, 20, 30, 0.7);
    --bg-card: rgba(255, 255, 255, 0.03);
    --text-main: #ffffff;
    --text-muted: #8b8b9e;
    --border: rgba(255, 255, 255, 0.08);
    --accent: #8b5cf6;
    --accent-cyan: #06b6d4;
    --green: #10b981;
    --red: #ef4444;
    --orange: #f59e0b;
    --radius-lg: 20px;
    --radius-md: 14px;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: var(--font-sans);
    min-height: 100vh;
    background-image: 
      radial-gradient(circle at 15% 10%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  .glass {
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  /* --- SOL MENÜ --- */
  .sidebar {
    position: fixed; top: 20px; left: 20px; bottom: 20px; width: 80px;
    border-radius: var(--radius-lg); z-index: 1000;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 0; gap: 8px; overflow: hidden; white-space: nowrap;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .sidebar:hover { width: 240px; align-items: flex-start; box-shadow: 0 0 40px rgba(0,0,0,0.8); }

  .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 800; color: var(--text-main); margin-bottom: 16px; width: 100%; padding-left: 28px; }
  .logo-icon { font-size: 24px; color: var(--accent); text-shadow: 0 0 15px var(--accent); }
  .logo-text { opacity: 0; transition: opacity 0.2s; }
  .sidebar:hover .logo-text { opacity: 1; }

  .nav-separator { width: 60%; height: 1px; background: var(--border); margin: 12px 0; transition: width 0.3s; }
  .sidebar:hover .nav-separator { width: 80%; }

  /* 🚀 PC SOL MENÜ İKON DÜZELTMESİ */
  .nav-item {
    display: flex; align-items: center; width: 100%; padding: 14px 0;
    justify-content: center; cursor: pointer; transition: all 0.2s;
    border-left: 3px solid transparent; gap: 16px;
  }
  .sidebar:hover .nav-item { justify-content: flex-start; padding-left: 25px; }
  .nav-item:hover { background: rgba(255,255,255,0.05); }
  .nav-item.active { background: linear-gradient(90deg, rgba(139, 92, 246, 0.15), transparent); border-left-color: var(--accent); }
  
  .nav-icon { 
    font-size: 22px; 
    width: 24px; 
    text-align: center; 
    display: flex; 
    justify-content: center; 
    opacity: 0.8;
  }
  .nav-item.active .nav-icon { opacity: 1; filter: drop-shadow(0 0 5px var(--accent)); }
  
  .nav-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .nav-item.active .nav-dot { box-shadow: 0 0 12px currentColor; }
  .nav-text { font-size: 14px; font-weight: 500; color: var(--text-muted); opacity: 0; transition: opacity 0.2s; }
  .nav-item.active .nav-text { color: var(--text-main); font-weight: 600; }
  .sidebar:hover .nav-text { opacity: 1; }

  /* --- ANA YERLEŞİM --- */
  .app-container {
    display: flex; flex-direction: column; gap: 20px;
    max-width: 1400px; margin: 0 auto; margin-left: 120px;
    padding: 20px 20px 20px 0; height: 100vh; overflow: hidden;
  }

  /* --- ÜST PANEL --- */
  .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-radius: var(--radius-lg); }
  .top-left { display: flex; align-items: center; gap: 24px; }
  .top-time { font-size: 20px; font-weight: 700; }
  .top-date { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
  .top-weather { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; border-left: 1px solid var(--border); padding-left: 24px; }
  .top-right { display: flex; align-items: center; gap: 16px; }
  .system-status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--green); font-weight: 600; background: rgba(16, 185, 129, 0.1); padding: 6px 12px; border-radius: 20px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  .greeting { font-size: 14px; font-weight: 500; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-cyan)); display: flex; align-items: center; justify-content: center; font-weight: bold; }

  /* --- İÇERİK ALANI VE ANİMASYON --- */
  .content-area { display: flex; gap: 20px; flex: 1; overflow: hidden; }
  .view-section { display: none; width: 100%; height: 100%; overflow-y: auto; padding-right: 8px; }
  
  .view-section.active { 
    display: block; 
    animation: fadeSlideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes fadeSlideIn {
    0% { opacity: 0; transform: translateY(20px) scale(0.99); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* --- GÜNDEM GÖRÜNÜMÜ --- */
  .feed-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .feed-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .search-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 12px 20px; color: var(--text-main); outline: none; width: 280px; transition: all 0.3s; }
  .search-box:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }

  /* 🚀 GÜNÜN ÖZETİ DÜZELTMESİ */
  .ai-briefing { background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(6, 182, 212, 0.05)); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; position: relative; overflow: hidden; transition: opacity 0.3s; }
  .ai-briefing::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); box-shadow: 0 0 15px var(--accent); }
  .ai-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .ai-icon { font-size: 20px; background: rgba(139, 92, 246, 0.2); padding: 8px; border-radius: 12px; }
  .ai-title { font-size: 18px; font-weight: 700; color: #fff; }
  .ai-badge { font-size: 10px; background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 10px; font-weight: 700; letter-spacing: 0.5px;}
  
  .ai-content { font-size: 15px; color: #cbd5e1; line-height: 1.6; }
  .ai-content p { margin-bottom: 12px; }

  .feed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .news-card { background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
  .news-card:hover { transform: translateY(-4px); border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 12px 30px rgba(0,0,0,0.5); }
  .news-card.read { opacity: 0.5; filter: grayscale(80%); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 12px; color: var(--text-muted); }
  .card-cat { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12px; padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid currentColor;}
  .card-title { font-size: 18px; font-weight: 600; line-height: 1.4; margin-bottom: 10px; color: var(--text-main); }
  .card-snippet { font-size: 14px; color: var(--text-muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .action-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05); color: var(--text-muted); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 16px; }
  .action-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
  .action-btn.liked { color: var(--accent); background: rgba(139, 92, 246, 0.15); border-color: rgba(139, 92, 246, 0.3); }

  /* --- PİYASALAR GÖRÜNÜMÜ --- */
  .market-header { margin-bottom: 24px; }
  .market-title { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .market-total { font-size: 48px; font-weight: 800; letter-spacing: -1px; }
  .market-total span { font-size: 24px; color: var(--text-muted); }
  .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .market-card { border-radius: var(--radius-lg); padding: 16px; position: relative; overflow: hidden; color: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
  .mc-purple { background: linear-gradient(135deg, #7c3aed, #4c1d95); }
  .mc-orange { background: linear-gradient(135deg, #f59e0b, #b45309); }
  .mc-red { background: linear-gradient(135deg, #ef4444, #991b1b); }
  .mc-cyan { background: linear-gradient(135deg, #06b6d4, #164e63); }
  .mc-green { background: linear-gradient(135deg, #10b981, #064e3b); }

  .mc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .mc-icon { background: rgba(255,255,255,0.2); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px;}
  .mc-label { font-size: 12px; font-weight: 600; opacity: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
  .mc-price { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .mc-change { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 6px; }
  .mc-chart-container { height: 50px; margin-top: 12px; width: 100%; }

  .mobile-widgets { display: none; }
  .status-msg { font-size: 14px; color: var(--text-muted); text-align: center; padding: 20px;}
  ::-webkit-scrollbar { width: 6px; height: 6px;}
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

  /* --- MODAL --- */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 2000; padding: 20px; }
  .modal-overlay.active { opacity: 1; pointer-events: all; }
  .modal-content { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; padding: 32px; transform: scale(0.95); transition: transform 0.3s; position: relative; box-shadow: 0 24px 64px rgba(0,0,0,0.6); }
  .modal-overlay.active .modal-content { transform: scale(1); }
  .modal-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px; transition: background 0.2s; }
  .modal-close:hover { background: rgba(255,255,255,0.2); }
  .modal-header { margin-bottom: 24px; }
  .modal-title { font-size: 26px; font-weight: 700; line-height: 1.3; margin-bottom: 16px; }
  .modal-meta { font-size: 14px; color: var(--text-muted); display: flex; gap: 12px; align-items: center; }
  .modal-body { font-size: 16px; line-height: 1.8; color: #cbd5e1; }
  .modal-link { display: inline-block; margin-top: 32px; background: var(--text-main); color: var(--bg-main); text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: 600; text-align: center; transition: transform 0.2s;}
  .modal-link:hover { transform: translateY(-2px); }

  /* --- 📱 MOBİL UYUMLULUK --- */
  @media (max-width: 768px) {
    body { overflow-y: auto; }
    .app-container { display: block; margin-left: 70px; padding: 10px 10px 40px 0; height: auto; overflow: visible; }
    .sidebar { top: 10px; left: 10px; bottom: 10px; width: 50px !important; padding: 16px 0; border-radius: var(--radius-md); }
    .sidebar:hover { width: 50px !important; align-items: center; } 
    .logo { display: none; }
    .nav-separator { width: 80%; }
    .nav-item { padding: 10px 0; justify-content: center; border-left: none; }
    .sidebar:hover .nav-item { padding-left: 0; justify-content: center;}
    .nav-item.active { background: rgba(139, 92, 246, 0.15); border-radius: 12px; }
    .nav-text { display: none !important; }
    .nav-dot { width: 10px; height: 10px; }
    .nav-icon { font-size: 20px; }

    .top-bar { padding: 12px; flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .top-left { flex-wrap: wrap; gap: 12px; width: 100%; justify-content: space-between; }
    .top-time { font-size: 16px; }
    .top-date { font-size: 12px; }
    .top-weather { border-left: none; padding-left: 0; font-size: 13px; }
    .top-right { display: none; }

    .content-area { display: block; overflow: visible; }
    .view-section { overflow-y: visible; padding-right: 0; }
    .feed-header { flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 16px;}
    .search-box { width: 100%; padding: 10px 16px; }
    .feed-grid { grid-template-columns: 1fr; gap: 16px; }

    .market-total { font-size: 32px; }
    .market-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    
    .mobile-widgets {
      display: flex; overflow-x: auto; gap: 10px; padding: 0 0 16px 0;
      margin-bottom: 16px; border-bottom: 1px solid var(--border);
      touch-action: pan-x; overscroll-behavior-x: contain; scrollbar-width: none;
    }
    .mobile-widgets::-webkit-scrollbar { display: none; }
    .mob-widget { flex: 0 0 auto; background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 16px; min-width: 130px; }
    .mob-widget .label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
    .mob-widget .val { font-size: 18px; font-weight: 700; margin-top: 4px;}
    .mob-widget .sub { font-size: 11px; font-weight: 600; margin-top: 2px;}
  }
</style>
</head>
<body>

<!-- SOL MENÜ -->
<aside class="sidebar glass">
  <div class="logo">
    <div class="logo-icon">📡</div>
    <div class="logo-text">RADAR</div>
  </div>
  
  <div class="nav-item active" id="nav-news" onclick="switchView('news', this)">
    <div class="nav-icon">📰</div>
    <span class="nav-text">Gündem</span>
  </div>
  <div class="nav-item" id="nav-market" onclick="switchView('market', this)">

    <span class="nav-text">Piyasalar</span>
  </div>

  <div class="nav-separator"></div>

  <div class="nav-item active" data-id="all" onclick="selectCategory('all', this)">
    <div class="nav-dot" style="background:#fff; box-shadow:0 0 10px #fff"></div> 
    <span class="nav-text">Tümü</span>
  </div>
  <!-- Kategoriler JS ile eklenecek -->
</aside>

<!-- ANA İÇERİK -->
<div class="app-container">
  
  <header class="top-bar glass">
    <div class="top-left">
      <div>
        <div class="top-time" id="clockTime">--:--</div>
        <div class="top-date" id="clockDate">Tarih Yükleniyor...</div>
      </div>
      <div class="top-weather" id="weatherHeader">
        <span>🌤️</span> <span id="weatherText">Hava durumu...</span>
      </div>
    </div>
    <div class="top-right">
      <div class="system-status">
        <div class="status-dot"></div> Sistem Aktif
      </div>
      <div class="greeting" id="greetingText">İyi Günler 👋</div>
      <div class="avatar">N</div>
    </div>
  </header>

  <div class="content-area">
    
    <div class="view-section active" id="view-news">
      <div class="mobile-widgets" id="mobileWidgets"></div>

      <div class="feed-header">
        <div class="feed-title" id="feedTitle">Gündem Akışı</div>
        <input type="search" class="search-box" id="searchInput" placeholder="Haberlerde ara...">
      </div>

      <div class="ai-briefing glass" id="aiBriefingCard">
        <div class="ai-header">
          <div class="ai-icon">✨</div>
          <div class="ai-title">Günün Özeti</div>
          <div class="ai-badge">RADAR AI</div>
        </div>
        <div class="ai-content" id="aiBriefingContent">Yapay zeka analiz ediyor...</div>
      </div>
      
      <div class="feed-grid" id="newsGrid">
        <div class="status-msg">Haberler yükleniyor... 📡</div>
      </div>
    </div>

    <div class="view-section" id="view-market">
      <div class="market-header">
        <div class="market-title">Toplam Piyasa Takibi</div>
        <div class="market-total" id="marketTotal">₺ --.--</div>
      </div>
      <div class="market-grid" id="marketGrid"></div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="newsModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-meta" id="modalMeta"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <a href="#" class="modal-link" id="modalLink" target="_blank">Haberi Kaynağında Oku ↗</a>
  </div>
</div>

<script>
const CATEGORIES = {
  teknoloji: { label: 'Teknoloji', color: '#06b6d4' },
  bilim:     { label: 'Bilim', color: '#10b981' },
  sanat:     { label: 'Sanat', color: '#f59e0b' },
  oyun:      { label: 'Ücretsiz Oyun', color: '#ef4444' },
  doga:      { label: 'Doğa', color: '#84cc16' },
  dunya:     { label: 'Dünya', color: '#8b5cf6' },
  gundem:    { label: 'Gündem', color: '#a1a1aa' },
  corlu:     { label: 'Çorlu', color: '#ec4899' }
};

let allNews = [];
let activeCat = 'all';
let searchQ = '';
let readLinks = new Set(JSON.parse(localStorage.getItem('radar_read') || '[]'));
let likedLinks = new Set(JSON.parse(localStorage.getItem('radar_liked') || '[]'));
let marketData = null;
let stocksData = null;
let cryptoData = null;
let aiBriefingText = "";

function esc(str) {
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; });
}

function timeAgo(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diff = (Date.now() - d.getTime()) / 60000;
  if (diff < 60) return Math.round(diff) + ' dk önce';
  if (diff < 1440) return Math.round(diff / 60) + ' sa önce';
  return Math.round(diff / 1440) + ' gün önce';
}

function switchView(viewName, el) {
  document.querySelectorAll('.sidebar > .nav-item').forEach(n => n.classList.remove('active'));
  if(el) el.classList.add('active');

  document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + viewName).classList.add('active');

  if(viewName === 'market') {
    setTimeout(() => { renderMarketCharts(); }, 100);
  }
}

function startClock() {
  function tick() {
    const now = new Date();
    document.getElementById('clockTime').textContent = now.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
    document.getElementById('clockDate').textContent = now.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });
    const hour = now.getHours();
    let greet = "İyi Geceler";
    if (hour >= 5 && hour < 12) greet = "Günaydın";
    else if (hour >= 12 && hour < 18) greet = "İyi Günler";
    else if (hour >= 18 && hour < 22) greet = "İyi Akşamlar";
    document.getElementById('greetingText').textContent = greet + " 👋";
  }
  tick();
  setInterval(tick, 1000);
}

function initSidebarCategories() {
  const sidebar = document.querySelector('.sidebar');
  Object.keys(CATEGORIES).forEach(id => {
    const cat = CATEGORIES[id];
    const el = document.createElement('div');
    el.className = 'nav-item';
    el.dataset.id = id;
    el.innerHTML = `<div class="nav-dot" style="background:${cat.color}; color:${cat.color}"></div> <span class="nav-text">${cat.label}</span>`;
    el.onclick = () => { switchView('news', document.getElementById('nav-news')); selectCategory(id, el); };
    sidebar.appendChild(el);
  });
}

function selectCategory(id, el) {
  document.querySelectorAll('.nav-item[data-id]').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  activeCat = id;
  
  const title = id === 'all' ? 'Gündem Akışı' : CATEGORIES[id].label;
  document.getElementById('feedTitle').textContent = title + ' Akışı';
  
  const aiCard = document.getElementById('aiBriefingCard');
  if(id === 'all') { aiCard.style.display = 'block'; } 
  else { aiCard.style.display = 'none'; }

  renderNews();
}

function renderNews() {
  const grid = document.getElementById('newsGrid');
  grid.innerHTML = '';
  let filtered = activeCat === 'all' ? allNews : allNews.filter(n => n.catId === activeCat);
  
  if (searchQ) {
    const q = searchQ.toLocaleLowerCase('tr');
    filtered = filtered.filter(n => n.title.toLocaleLowerCase('tr').includes(q));
  }

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="status-msg">Bu kategoride henüz haber yok.</div>';
    return;
  }

  filtered.forEach(item => {
    const cat = CATEGORIES[item.catId] || { label: 'Haber', color: '#fff' };
    const isRead = readLinks.has(item.link);
    const isLiked = likedLinks.has(item.link);
    const card = document.createElement('div');
    card.className = 'news-card' + (isRead ? ' read' : '');
    
    card.innerHTML = `
      <div class="card-header">
        <div class="card-cat" style="color:${cat.color}; background:${cat.color}15;">
          ${esc(cat.label)}
        </div>
        <div>${timeAgo(item.pubDate)}</div>
      </div>
      <div class="card-title">${esc(item.title)}</div>
      <div class="card-snippet">${esc(item.summary) || 'Özet hazırlanıyor...'}</div>
      <div class="card-actions">
        <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" onclick="event.stopPropagation(); toggleLike('${esc(item.link)}', this)">
          ${isLiked ? '♥' : '♡'}
        </button>
      </div>
    `;
    card.onclick = () => openModal(item, cat);
    grid.appendChild(card);
  });
}

// 🚀 YENİ: GERÇEK AI BRIEFING METNİNİ BASAN FONKSİYON
function renderAIBriefing() {
  const container = document.getElementById('aiBriefingContent');
  if (aiBriefingText && aiBriefingText.length > 10) {
    container.innerHTML = `<p>${esc(aiBriefingText)}</p>`;
  } else {
    // Eğer Python'dan briefing gelmediyse eski yöntemle listele (Fallback)
    if (!allNews || allNews.length === 0) { container.innerHTML = 'Analiz edilecek haber yok.'; return; }
    const topNews = allNews.slice(0, 3);
    let html = '<p style="margin-bottom: 12px; color: #fff;">Bugünün öne çıkan başlıkları:</p><ul>';
    topNews.forEach(n => { html += `<li><strong>${esc(n.title)}</strong></li>`; });
    html += '</ul>';
    container.innerHTML = html;
  }
}

function openModal(item, cat) {
  readLinks.add(item.link);
  localStorage.setItem('radar_read', JSON.stringify(Array.from(readLinks)));
  document.getElementById('modalTitle').textContent = item.title;
  document.getElementById('modalMeta').innerHTML = `<span style="color:${cat.color}; font-weight:600;">${esc(cat.label)}</span><span>•</span><span>${esc(item.source)}</span><span>•</span><span>${timeAgo(item.pubDate)}</span>`;
  document.getElementById('modalBody').textContent = item.summary || item.snippet || 'Detaylı özet hazırlanmadı.';
  document.getElementById('modalLink').href = item.link;
  document.getElementById('newsModal').classList.add('active');
  renderNews(); 
}
function closeModal() { document.getElementById('newsModal').classList.remove('active'); }
document.getElementById('newsModal').addEventListener('click', (e) => { if (e.target.id === 'newsModal') closeModal(); });

function toggleLike(link, btn) {
  if (likedLinks.has(link)) { likedLinks.delete(link); btn.classList.remove('liked'); btn.textContent = '♡'; } 
  else { likedLinks.add(link); btn.classList.add('liked'); btn.textContent = '♥'; }
  localStorage.setItem('radar_liked', JSON.stringify(Array.from(likedLinks)));
}

async function loadData() {
  try {
    const res = await fetch('news.json?t=' + Date.now());
    if (!res.ok) throw new Error('Veri alınamadı');
    const data = await res.json();
    allNews = data.items || [];
    marketData = data.market;
    stocksData = data.stocks;
    cryptoData = data.crypto;
    aiBriefingText = data.briefing || ""; // YENİ: AI özetini al

    renderNews();
    renderAIBriefing(); // Yeni fonksiyonu çağır
    renderMarketView(); 
    renderWeatherHeader(data.weather); 
    renderMobileMarketStrip(); 
    
  } catch (e) {
    document.getElementById('newsGrid').innerHTML = `<div class="status-msg">Bağlantı hatası: ${e.message}</div>`;
  }
}

function renderWeatherHeader(weather) {
  if (!weather || weather.temp == null) return;
  document.getElementById('weatherText').textContent = `${Math.round(weather.temp)}°C · ${weather.desc} (Çorlu)`;
}

function renderMobileMarketStrip() {
  const container = document.getElementById('mobileWidgets');
  if (!marketData) return;
  let html = '';
  if (marketData.usdtry) html += `<div class="mob-widget"><div class="label">USD/TRY</div><div class="val">${marketData.usdtry.toFixed(2)}</div></div>`;
  if (marketData.gold_gram_try) html += `<div class="mob-widget"><div class="label">Gram Altın</div><div class="val">₺${marketData.gold_gram_try.toLocaleString('tr-TR')}</div></div>`;
  if (stocksData && stocksData.length > 0) {
    stocksData.slice(0, 3).forEach(s => {
      if (s.price == null) return;
      const pct = s.change_pct;
      const colorClass = pct > 0 ? 'up' : (pct < 0 ? 'down' : '');
      const sign = pct > 0 ? '+' : '';
      html += `<div class="mob-widget"><div class="label">${esc(s.label)}</div><div class="val">${s.price.toLocaleString('tr-TR')}</div>${pct != null ? `<div class="sub ${colorClass}">${sign}${pct.toFixed(2)}%</div>` : ''}</div>`;
    });
  }
  container.innerHTML = html;
}

function renderMarketView() {
  const grid = document.getElementById('marketGrid');
  const totalEl = document.getElementById('marketTotal');
  
  if (!marketData && (!stocksData || stocksData.length === 0)) {
    grid.innerHTML = '<div class="status-msg">Piyasa verisi yüklenemedi.</div>';
    return;
  }

  if (marketData && marketData.ceyrek_altin_try) {
    totalEl.textContent = `₺${marketData.ceyrek_altin_try.toLocaleString('tr-TR')}`;
  } else if (marketData && marketData.gold_gram_try) {
    totalEl.textContent = `₺${marketData.gold_gram_try.toLocaleString('tr-TR')}`;
  }

  let html = '';
  const cards = [];
  const colors = ['mc-purple', 'mc-orange', 'mc-red', 'mc-cyan', 'mc-green'];
  let colorIdx = 0;

  if (marketData) {
    if (marketData.usdtry) cards.push({ label: 'USD / TRY', price: marketData.usdtry, change: 0.4, icon: '$' });
    if (marketData.eurtry) cards.push({ label: 'EUR / TRY', price: marketData.eurtry, change: -0.2, icon: '€' });
    if (marketData.gold_gram_try) cards.push({ label: 'Gram Altın', price: marketData.gold_gram_try, change: 1.2, icon: '🪙' });
    if (marketData.ceyrek_altin_try) cards.push({ label: 'Çeyrek Altın', price: marketData.ceyrek_altin_try, change: 1.1, icon: '🥇' });
  }
  if (cryptoData && cryptoData.length > 0) {
    cryptoData.forEach(c => { if (c.price) cards.push({ label: c.label, price: c.price, change: c.change_pct || 0, icon: '₿' }); });
  }
  if (stocksData) {
    stocksData.forEach(s => { if (s.price != null) cards.push({ label: s.label, price: s.price, change: s.change_pct || 0, icon: '📈' }); });
  }

  cards.forEach((c, index) => {
    const isUp = c.change >= 0;
    const sign = isUp ? '+' : '';
    const arrow = isUp ? '▲' : '▼';
    const colorClass = colors[colorIdx % colors.length];
    colorIdx++;
    
    html += `
      <div class="market-card ${colorClass}">
        <div class="mc-header">
          <div class="mc-label">${esc(c.label)}</div>
          <div class="mc-icon">${c.icon}</div>
        </div>
        <div class="mc-price">${c.price.toLocaleString('tr-TR', {minimumFractionDigits: 2})}</div>
        <div class="mc-change">${arrow} ${sign}${c.change.toFixed(2)}%</div>
        <div class="mc-chart-container"><canvas id="chart-${index}"></canvas></div>
      </div>
    `;
  });
  grid.innerHTML = html;
}

function renderMarketCharts() {
  const cards = document.querySelectorAll('.market-card');
  cards.forEach((card, i) => {
    const canvas = card.querySelector('canvas');
    if (!canvas) return;
    const basePrice = parseFloat(card.querySelector('.mc-price').textContent.replace(/\./g, '').replace(',', '.'));
    const dataPoints = [];
    let current = basePrice * 0.98;
    for (let j = 0; j < 20; j++) { current = current + (Math.random() - 0.45) * (basePrice * 0.01); dataPoints.push(current); }
    dataPoints.push(basePrice);

    const ctx = canvas.getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: Array(21).fill(''),
        datasets: [{
          data: dataPoints,
          borderColor: 'rgba(255, 255, 255, 0.8)',
          borderWidth: 2, pointRadius: 0, tension: 0.4, fill: true,
          backgroundColor: (context) => {
            const gradient = ctx.createLinearGradient(0, 0, 0, 60);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            return gradient;
          }
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { x: { display: false }, y: { display: false } }, animation: { duration: 1500 } }
    });
  });
}

document.getElementById('searchInput').addEventListener('input', (e) => { searchQ = e.target.value.trim(); renderNews(); });

startClock();
initSidebarCategories();
loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
