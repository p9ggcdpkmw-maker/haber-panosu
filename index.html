<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keşif Panosu</title>
<style>
  :root{
    --bg:#1B1713;
    --tray:#241E18;
    --ink:#F2E9DC;
    --ink-dim:#A99C89;
    --rule:#3A3025;
    --paper:#2C251D;
    --font-display: Georgia, 'Source Serif Pro', 'Iowan Old Style', serif;
    --font-sans: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);}
  body{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    background-image: radial-gradient(circle at 20% 0%, #2a2219 0%, transparent 45%), radial-gradient(circle at 85% 15%, #221c16 0%, transparent 40%);
  }
  header{padding:30px 18px 6px;max-width:760px;margin:0 auto;}
  h1{font-family:var(--font-display);font-weight:400;font-size:27px;letter-spacing:0.2px;margin:0 0 8px;}
  .sub{color:var(--ink-dim);font-size:13.5px;line-height:1.55;margin:0;max-width:520px;}
  .bar{display:flex;flex-wrap:wrap;gap:8px;max-width:760px;margin:20px auto 0;padding:0 18px;}
  .tab{border:1.5px dashed var(--rule);background:transparent;color:var(--ink-dim);padding:6px 14px;border-radius:14px;font-size:12.5px;cursor:pointer;font-family:var(--font-sans);}
  .tab.active{background:var(--catColor,#D8A34E);border-color:transparent;border-style:solid;color:#1B1713;font-weight:700;}
  .refresh{margin-left:auto;border:none;color:#1B1713;background:var(--ink);padding:6px 16px;border-radius:14px;font-size:12.5px;cursor:pointer;font-weight:700;}
  main{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
  .status{color:var(--ink-dim);font-size:12.5px;margin:0 4px 16px;min-height:16px;}
  .tray{display:flex;flex-direction:column;gap:14px;}
  .item{
    display:block;text-decoration:none;color:inherit;
    background:var(--paper);
    border-left:5px solid var(--catColor,#D8A34E);
    border-radius:4px 16px 16px 4px;
    padding:14px 16px;
    box-shadow:0 1px 0 rgba(0,0,0,.25);
  }
  .item:nth-child(3n+1){transform:rotate(-0.4deg);}
  .item:nth-child(3n+2){transform:rotate(0.5deg);}
  .item:nth-child(3n){transform:rotate(-0.15deg);}
  .item:hover{transform:rotate(0deg) translateY(-1px);}
  .item:hover .title{color:var(--catColor,#D8A34E);}
  .meta{font-size:11.5px;color:var(--catColor,#D8A34E);margin-bottom:7px;display:flex;gap:7px;align-items:center;font-weight:600;letter-spacing:0.1px;}
  .meta .dot{color:var(--ink-dim);font-weight:400;}
  .cat-tag{color:var(--catColor,#D8A34E);}
  .title{font-family:var(--font-display);font-size:17px;line-height:1.4;color:var(--ink);}
  .empty{color:var(--ink-dim);font-size:14px;padding:20px 4px;}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F3ECDF; --tray:#fff; --paper:#FFFBF3; --ink:#241C12; --ink-dim:#8A7C66; --rule:#D8CBB2;
    }
  }
</style>
</head>
<body>
<header>
  <h1>Keşif Panosu</h1>
  <p class="sub">Teknoloji, bilim, sanat, ücretsiz oyunlar ve doğa üzerine — açtığın anda yerli ve yabancı kaynaklardan taranmış başlıklar. Bir başlığa dokun, doğrudan kaynağına gider.</p>
</header>

<div class="bar" id="tabBar"></div>

<main>
  <div class="status" id="status">Yükleniyor…</div>
  <div id="list" class="tray"></div>
</main>

<script>
// ---- Buradan düzenleyebilirsin: kategori adı ve Google Haberler arama sorgusu ----
const CATEGORIES = [
  { id: 'teknoloji', label: 'Teknoloji', query: 'teknoloji' },
  { id: 'bilim',     label: 'Bilim',     query: 'bilim' },
  { id: 'sanat',     label: 'Sanat',     query: 'sanat' },
  { id: 'oyun',      label: 'Ücretsiz Oyun', query: 'ücretsiz oyun dağıtıyor' },
  { id: 'doga',      label: 'Doğa',      query: 'doğa çevre' },
];

const CAT_COLORS = {
  teknoloji: '#5B8DEF',
  bilim:     '#E0A62B',
  sanat:     '#C25B6B',
  oyun:      '#4FA37A',
  doga:      '#8FA34E',
};

const PROXIES = [
  url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
  url => 'https://corsproxy.io/?url=' + encodeURIComponent(url),
  url => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
];

function baseUrl(query){
  return 'https://news.google.com/rss/search?q=' + encodeURIComponent(query) + '&hl=tr&gl=TR&ceid=TR:tr';
}

async function fetchWithFallback(targetUrl){
  let lastErr;
  for (const build of PROXIES){
    try {
      const res = await fetch(build(targetUrl));
      if (!res.ok) throw new Error('status ' + res.status);
      const text = await res.text();
      if (!text || text.length < 50) throw new Error('boş yanıt');
      return text;
    } catch(e){
      lastErr = e;
    }
  }
  throw lastErr || new Error('tüm kaynaklar başarısız');
}

function timeAgo(dateStr){
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diffMin = Math.round((Date.now() - d.getTime()) / 60000);
  if (diffMin < 60) return diffMin + ' dk önce';
  const diffH = Math.round(diffMin / 60);
  if (diffH < 24) return diffH + ' sa önce';
  return Math.round(diffH / 24) + ' gün önce';
}

async function fetchCategory(cat){
  const xmlText = await fetchWithFallback(baseUrl(cat.query));
  const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
  const items = Array.from(xml.querySelectorAll('item')).slice(0, 12);
  return items.map(it => {
    const rawTitle = it.querySelector('title')?.textContent || '';
    const sourceEl = it.querySelector('source');
    const sourceName = sourceEl ? sourceEl.textContent : (rawTitle.split(' - ').pop() || '');
    const title = rawTitle.replace(' - ' + sourceName, '');
    return {
      cat: cat.label,
      title,
      source: sourceName,
      link: it.querySelector('link')?.textContent || '#',
      pubDate: it.querySelector('pubDate')?.textContent || ''
    };
  });
}

let all = [];
let active = 'all';

function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  const filtered = active === 'all' ? all : all.filter(i => i.catId === active);
  if (filtered.length === 0){
    list.innerHTML = '<div class="empty">Bu kategoride şu an gösterilecek başlık yok. "Yenile"yi dene.</div>';
    return;
  }
  filtered.forEach(item => {
    const a = document.createElement('a');
    a.className = 'item';
    a.href = item.link;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.setProperty('--catColor', CAT_COLORS[item.catId] || '#D8A34E');
    a.innerHTML =
      '<div class="meta"><span class="cat-tag">' + item.cat + '</span>' +
      (item.source ? '<span class="dot">·</span>' + item.source : '') +
      (item.pubDate ? '<span class="dot">·</span>' + timeAgo(item.pubDate) : '') + '</div>' +
      '<div class="title">' + item.title + '</div>';
    list.appendChild(a);
  });
}

function renderTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  const allTab = document.createElement('button');
  allTab.className = 'tab active';
  allTab.textContent = 'Tümü';
  allTab.onclick = () => setActive('all', allTab);
  bar.appendChild(allTab);

  CATEGORIES.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.textContent = cat.label;
    b.style.setProperty('--catColor', CAT_COLORS[cat.id] || '#D8A34E');
    b.onclick = () => setActive(cat.id, b);
    bar.appendChild(b);
  });

  const refreshBtn = document.createElement('button');
  refreshBtn.className = 'refresh';
  refreshBtn.textContent = 'Yenile';
  refreshBtn.onclick = loadAll;
  bar.appendChild(refreshBtn);
}

function setActive(id, btn){
  active = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

async function loadAll(){
  const status = document.getElementById('status');
  status.textContent = 'Yükleniyor…';
  try {
    const results = await Promise.all(CATEGORIES.map(async cat => {
      try {
        const items = await fetchCategory(cat);
        return items.map(i => ({...i, catId: cat.id}));
      } catch(e){
        return [];
      }
    }));
    all = results.flat().sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
    status.textContent = all.length
      ? 'Son güncelleme: ' + new Date().toLocaleTimeString('tr-TR')
      : 'Haberler alınamadı, lütfen tekrar dene.';
    render();
  } catch(e){
    status.textContent = 'Bir şeyler ters gitti. Yenile butonunu dene.';
  }
}

renderTabs();
loadAll();
</script>
</body>
</html>
