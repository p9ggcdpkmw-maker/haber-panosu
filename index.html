<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keşif Panosu</title>
<style>
  :root{
    --bg:#10140F;
    --panel:#161C14;
    --ink:#EDEAE3;
    --ink-dim:#9CA695;
    --rule:#2A3324;
    --moss:#7FA66B;
    --amber:#D8A34E;
    --font-serif: Georgia, 'Source Serif Pro', 'Iowan Old Style', serif;
    --font-sans: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);}
  body{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  header{padding:28px 20px 10px;max-width:760px;margin:0 auto;}
  h1{font-family:var(--font-serif);font-weight:400;font-size:28px;letter-spacing:0.2px;margin:0 0 6px;}
  .sub{color:var(--ink-dim);font-size:14px;line-height:1.5;margin:0;}
  .bar{display:flex;flex-wrap:wrap;gap:8px;max-width:760px;margin:18px auto 0;padding:0 20px;}
  .tab{border:1px solid var(--rule);background:transparent;color:var(--ink-dim);padding:7px 13px;border-radius:999px;font-size:13px;cursor:pointer;font-family:var(--font-sans);}
  .tab.active{background:var(--moss);border-color:var(--moss);color:#0E130B;font-weight:600;}
  .refresh{margin-left:auto;border:1px solid var(--amber);color:var(--amber);background:transparent;padding:7px 13px;border-radius:999px;font-size:13px;cursor:pointer;}
  main{max-width:760px;margin:0 auto;padding:18px 20px 60px;}
  .status{color:var(--ink-dim);font-size:13px;margin:10px 2px 18px;min-height:18px;}
  .item{border-top:1px solid var(--rule);padding:18px 2px;display:block;text-decoration:none;color:inherit;}
  .item:first-child{border-top:none;}
  .item:hover .title{color:var(--amber);}
  .meta{font-size:12px;color:var(--moss);margin-bottom:6px;display:flex;gap:8px;align-items:center;}
  .cat-tag{color:var(--ink-dim);}
  .title{font-family:var(--font-serif);font-size:18px;line-height:1.4;color:var(--ink);}
  .empty{color:var(--ink-dim);font-size:14px;padding:20px 2px;}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F6F5F0; --panel:#fff; --ink:#1B1F17; --ink-dim:#6B7262; --rule:#DEDBCF; --moss:#4C7036; --amber:#9B6A1E;
    }
  }
</style>
</head>
<body>
<header>
  <h1>Keşif Panosu</h1>
  <p class="sub">Teknoloji, bilim, sanat, ücretsiz oyunlar ve doğa üzerine — açtığın anda yerli ve yabancı kaynaklardan taranmış başlıklar. Bir başlığa dokun, doğrudan kaynağına gider.</p>
</header>

<div class="bar" id="tabBar"></div>

<main>
  <div class="status" id="status">Yükleniyor…</div>
  <div id="list"></div>
</main>

<script>
const CATEGORIES = [
  { id: 'teknoloji', label: 'Teknoloji', query: 'teknoloji' },
  { id: 'bilim',     label: 'Bilim',     query: 'bilim' },
  { id: 'sanat',     label: 'Sanat',     query: 'sanat' },
  { id: 'oyun',      label: 'Ücretsiz Oyun', query: 'ücretsiz oyun dağıtıyor' },
  { id: 'doga',      label: 'Doğa',      query: 'doğa çevre' },
];

const PROXIES = [
  url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
  url => 'https://corsproxy.io/?url=' + encodeURIComponent(url),
  url => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
];

function baseUrl(query){
  return 'https://news.google.com/rss/search?q=' + encodeURIComponent(query) + '&hl=tr&gl=TR&ceid=TR:tr';
}

async function fetchWithFallback(targetUrl){
  let lastErr;
  for (const build of PROXIES){
    try {
      const res = await fetch(build(targetUrl));
      if (!res.ok) throw new Error('status ' + res.status);
      const text = await res.text();
      if (!text || text.length < 50) throw new Error('boş yanıt');
      return text;
    } catch(e){
      lastErr = e;
    }
  }
  throw lastErr || new Error('tüm kaynaklar başarısız');
}

function timeAgo(dateStr){
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diffMin = Math.round((Date.now() - d.getTime()) / 60000);
  if (diffMin < 60) return diffMin + ' dk önce';
  const diffH = Math.round(diffMin / 60);
  if (diffH < 24) return diffH + ' sa önce';
  return Math.round(diffH / 24) + ' gün önce';
}

async function fetchCategory(cat){
  const xmlText = await fetchWithFallback(baseUrl(cat.query));
  const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
  const items = Array.from(xml.querySelectorAll('item')).slice(0, 12);
  return items.map(it => {
    const rawTitle = it.querySelector('title')?.textContent || '';
    const sourceEl = it.querySelector('source');
    const sourceName = sourceEl ? sourceEl.textContent : (rawTitle.split(' - ').pop() || '');
    const title = rawTitle.replace(' - ' + sourceName, '');
    return {
      cat: cat.label,
      title,
      source: sourceName,
      link: it.querySelector('link')?.textContent || '#',
      pubDate: it.querySelector('pubDate')?.textContent || ''
    };
  });
}

let all = [];
let active = 'all';

function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  const filtered = active === 'all' ? all : all.filter(i => i.catId === active);
  if (filtered.length === 0){
    list.innerHTML = '<div class="empty">Bu kategoride şu an gösterilecek başlık yok. "Yenile"yi dene.</div>';
    return;
  }
  filtered.forEach(item => {
    const a = document.createElement('a');
    a.className = 'item';
    a.href = item.link;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.innerHTML =
      '<div class="meta"><span class="cat-tag">' + item.cat + '</span>' +
      (item.source ? ' · ' + item.source : '') +
      (item.pubDate ? ' · ' + timeAgo(item.pubDate) : '') + '</div>' +
      '<div class="title">' + item.title + '</div>';
    list.appendChild(a);
  });
}

function renderTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  const allTab = document.createElement('button');
  allTab.className = 'tab active';
  allTab.textContent = 'Tümü';
  allTab.onclick = () => setActive('all', allTab);
  bar.appendChild(allTab);

  CATEGORIES.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.textContent = cat.label;
    b.onclick = () => setActive(cat.id, b);
    bar.appendChild(b);
  });

  const refreshBtn = document.createElement('button');
  refreshBtn.className = 'refresh';
  refreshBtn.textContent = 'Yenile';
  refreshBtn.onclick = loadAll;
  bar.appendChild(refreshBtn);
}

function setActive(id, btn){
  active = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

async function loadAll(){
  const status = document.getElementById('status');
  status.textContent = 'Yükleniyor…';
  try {
    const results = await Promise.all(CATEGORIES.map(async cat => {
      try {
        const items = await fetchCategory(cat);
        return items.map(i => ({...i, catId: cat.id}));
      } catch(e){
        return [];
      }
    }));
    all = results.flat().sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
    status.textContent = all.length
      ? 'Son güncelleme: ' + new Date().toLocaleTimeString('tr-TR')
      : 'Haberler alınamadı, lütfen tekrar dene.';
    render();
  } catch(e){
    status.textContent = 'Bir şeyler ters gitti. Yenile butonunu dene.';
  }
}

renderTabs();
loadAll();
</script>
</body>
</html>
